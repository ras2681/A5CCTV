name: Unpack A5 CCTV project

on:
workflow_dispatch:

permissions:
contents: write

jobs:
unpack:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4
with:
ref: main

  - name: Check archive
    run: |
      set -eu
      if [ ! -f "A5CCTV_GitHub_Ready.zip" ]; then
        echo "ERROR: ZIP archive not found in repository root"
        ls -la
        exit 1
      fi
  - name: Extract project
    run: |
      set -eu
      TEMP_DIR="$(mktemp -d)"
      unzip -q A5CCTV_GitHub_Ready.zip -d "$TEMP_DIR"
      SETTINGS_FILE="$(find "$TEMP_DIR" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
      if [ -z "$SETTINGS_FILE" ]; then
        echo "ERROR: Gradle settings file not found in ZIP"
        find "$TEMP_DIR" -maxdepth 5 -type f | sort | head -200
        exit 1
      fi
      PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
      if [ ! -d "$PROJECT_DIR/app" ]; then
        echo "ERROR: Android app folder not found"
        exit 1
      fi
      rsync -a \
        --exclude='.git/' \
        --exclude='.github/' \
        "$PROJECT_DIR/" ./
      test -d app
      test -f settings.gradle.kts || test -f settings.gradle
      echo "Project successfully extracted."
      ls -la
  - name: Commit extracted files
    run: |
      set -eu
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      if git diff --cached --quiet; then
        echo "No new files to commit."
        exit 0
      fi
      git commit -m "Extract A5 CCTV Android project"
      git push origin HEAD:main
