name: Extract A5CCTV project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found in repository root"
            exit 1
          fi

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type d -name app -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android app folder not found inside ZIP"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract Android project from ZIP" || echo "No changes"
          git push
