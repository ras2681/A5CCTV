name: Build A5 CCTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p project

          unzip -q A5CCTV_GitHub_Ready.zip -d project

          if [ -f "project/settings.gradle.kts" ] || [ -f "project/settings.gradle" ]; then
            echo "Project found in archive root"
          else
            PROJECT_DIR=$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -n "$PROJECT_DIR" ] && [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
              echo "Project found in: $PROJECT_DIR"
              cp -R "$PROJECT_DIR"/. project/
            elif [ -n "$PROJECT_DIR" ] && [ -f "$PROJECT_DIR/settings.gradle" ]; then
              echo "Project found in: $PROJECT_DIR"
              cp -R "$PROJECT_DIR"/. project/
            else
              echo "ERROR: Gradle project was not found in ZIP"
              find project -maxdepth 3 -type f | sort
              exit 1
            fi
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A5CCTV-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
