name: Build A5 CCTV APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle
  - name: Check Android project
    shell: bash
    run: |
      set -eu
      if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
        echo "::error::Android project not found in repository root."
        echo "Run Unpack A5 CCTV project first."
        exit 1
      fi
      if [ ! -f app/build.gradle.kts ] && [ ! -f app/build.gradle ]; then
        echo "::error::The app module was not found."
        exit 1
      fi
      echo "Android project structure verified."
  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'
  - name: Build debug APK
    shell: bash
    run: gradle assembleDebug --no-daemon --stacktrace
  - name: Find APK
    shell: bash
    run: |
      set -eu
      find app/build/outputs/apk -type f -name '*.apk' -print
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: A5CCTV-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
