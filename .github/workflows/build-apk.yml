name: Build A5 CCTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fix JVM target compatibility
        shell: bash
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              text = text.replace(
                  "android {\n",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

          """,
                  1
              )

          path.write_text(text)
          print("JVM target fixed to Java 17")
          print(path.read_text())
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A5CCTV-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
